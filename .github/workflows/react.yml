name: React App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        run: |
          ls -la day1
          test -f day1/package.json
          test -f day1/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./day1

      - name: Build React app
        run: npm run build
        working-directory: ./day1